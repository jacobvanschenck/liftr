<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08080A" />
    <meta name="color-scheme" content="dark" />
    <title>Offline · Liftr</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #08080a;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 24px;
        background: radial-gradient(900px 420px at 50% -160px, rgba(10, 132, 255, 0.16), transparent 65%),
          #08080a;
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 16px;
        width: min(100%, 360px);
        text-align: center;
      }
      img {
        width: 58px;
        height: 58px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(10, 132, 255, 0.26);
      }
      .code {
        color: #0a84ff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: 34px;
        font-weight: 760;
        letter-spacing: -0.05em;
        line-height: 1.05;
      }
      p {
        margin: 0;
        color: #8e8e96;
        font-size: 14px;
        line-height: 1.6;
      }
      button {
        min-height: 48px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: #0a84ff;
        color: #fff;
        font: inherit;
        font-size: 15px;
        font-weight: 650;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(10, 132, 255, 0.24);
      }
      button:active {
        transform: scale(0.985);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="58" height="58" />
      <p class="code">No connection</p>
      <h1>The gym can wait.</h1>
      <p>
        Liftr needs a connection to save sets. Reconnect, then reopen the app — your last
        session is still on the server.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
